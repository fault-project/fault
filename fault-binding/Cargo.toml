[package]
name = "fault-binding"
description = "Language-neutral engine handle shared by the fault language bindings"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
homepage.workspace = true
readme = "README.md"

[dependencies]
fault-engine = { version = "1.1.0", path = "../fault-engine" }
fault-model = { version = "1.1.0", path = "../fault-model" }
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.49.0", features = ["sync", "time"] }
uuid = "1.25.0"

[dev-dependencies]
tokio = { version = "1.49.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
