[package]
name = "fault-typescript"
description = "TypeScript bindings for the fault network fault-injection engine"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
homepage.workspace = true
readme = "README.md"

[lib]
name = "faultlib"
crate-type = ["cdylib"]

[dependencies]
fault-binding = { version = "1.1.0", path = "../fault-binding" }
napi = { version = "3.14.2", features = ["napi4", "tokio_rt"] }
napi-derive = "3.6.12"

[build-dependencies]
napi-build = "2.6.0"
