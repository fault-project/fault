name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish-crates:
        description: Publish missing Rust crates to crates.io
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - id: package
        name: Read package version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "fault-cli") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* \
            && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
          npm_version=$(jq -r .version fault-typescript/package.json)
          if [[ "$npm_version" != "$version" ]]; then
            echo "fault-typescript/package.json version $npm_version does not match $version" >&2
            exit 1
          fi

  binaries:
    needs: metadata
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: fault-linux-x86_64
            binary: target/prod-fast/fault
            platform: linux-x86_64
          - os: macos-15
            artifact: fault-macos-aarch64
            binary: target/prod-fast/fault
            platform: macos-aarch64
          - os: windows-latest
            artifact: fault-windows-x86_64
            binary: target/prod-fast/fault.exe
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --profile prod-fast -p fault-cli
      - name: Name release binary
        if: runner.os != 'Windows'
        run: |
          cp "${{ matrix.binary }}" "fault-${{ matrix.platform }}"
          chmod +x "fault-${{ matrix.platform }}"
      - name: Name release binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          Copy-Item -Path "${{ matrix.binary }}"
          -Destination
          "fault-${{ matrix.platform }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: fault-${{ matrix.platform }}*
          if-no-files-found: error

  python-wheels:
    needs: metadata
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64
          - os: macos-15
            target: universal2-apple-darwin
          - os: windows-latest
            target: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: >-
            --release --out dist
            --manifest-path fault-python/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: fault-python-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  python-sdist:
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: >-
            --out dist --manifest-path fault-python/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: fault-python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  typescript-bindings:
    needs: metadata
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            # Link against glibc 2.17 so the addon loads on older distributions.
            flags: --use-napi-cross
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: fault-typescript
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: typescript-${{ matrix.target }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fault-typescript/package-lock.json
      - run: npm ci
      - run: >-
          npx napi build --platform --release --esm
          --js native.js --dts native.d.ts
          --target ${{ matrix.target }} ${{ matrix.flags }}
      - run: npm run build:ts
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: fault-typescript-${{ matrix.target }}
          path: fault-typescript/faultlib.*.node
          if-no-files-found: error
      - name: Upload the generated loader
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v4
        with:
          name: fault-typescript-loader
          path: |
            fault-typescript/native.js
            fault-typescript/native.d.ts
          if-no-files-found: error

  crates:
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      inputs.publish-crates
    needs: [metadata, binaries, python-wheels, python-sdist, typescript-bindings]
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
      PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish Rust crates in dependency order
        shell: bash
        run: |
          publish() {
            local package="$1"
            local attempt

            for attempt in {1..6}; do
              if curl --fail --silent \
                --user-agent "fault-release/1.0 (https://github.com/fault-project/fault)" \
                "https://crates.io/api/v1/crates/${package}/${PACKAGE_VERSION}" \
                >/dev/null; then
                echo "${package} ${PACKAGE_VERSION} is already published"
                return 0
              fi

              if cargo publish --locked --package "$package"; then
                return 0
              fi

              if [[ "$attempt" == 6 ]]; then
                return 1
              fi

              echo "Waiting for crates.io to index dependencies before retrying..."
              sleep 15
            done
          }

          publish fault-model
          publish fault-engine
          publish fault-cli

  pypi:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [metadata, python-wheels, python-sdist]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/faultlib
    permissions:
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v6
        with:
          pattern: fault-python-*
          path: dist
          merge-multiple: true
      - name: Publish Python distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [metadata, typescript-bindings]
    runs-on: ubuntu-24.04
    environment:
      name: npm
      url: https://www.npmjs.com/package/faultlib
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: fault-typescript
    # Trusted publishing: npm authenticates this job through GitHub OIDC
    # (id-token: write), so no npm token is stored. Each package names
    # fault-project/fault, release.yaml, and the npm environment as its
    # trusted publisher with stage-only permissions, and provenance is
    # attached automatically. Nothing becomes installable until a maintainer
    # approves every staged package with 2FA on npmjs.com or `npm stage`.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: fault-typescript/package-lock.json
      - name: Use an npm CLI that supports staged trusted publishing
        run: npm install --global npm@^11.21.0
      - run: npm ci
      - uses: actions/download-artifact@v6
        with:
          pattern: fault-typescript-*-*
          path: fault-typescript/artifacts
      - uses: actions/download-artifact@v6
        with:
          name: fault-typescript-loader
          path: fault-typescript
      - run: npx napi create-npm-dirs
      - run: npx napi artifacts --output-dir artifacts --npm-dir npm
      - name: Verify every platform package has its addon
        run: |
          for target in linux-x64-gnu darwin-arm64 darwin-x64 win32-x64-msvc; do
            test -f "npm/$target/faultlib.$target.node" \
              || { echo "missing addon for $target" >&2; exit 1; }
          done
      - run: npm run build:ts
      - name: Pin the platform packages as optional dependencies
        run: >-
          npx napi prepublish -t npm
          --no-gh-release --skip-optional-publish
      - name: Stage the platform packages
        run: |
          for target in linux-x64-gnu darwin-arm64 darwin-x64 win32-x64-msvc; do
            (cd "npm/$target" && npm stage publish)
          done
      - name: Stage faultlib
        run: npm stage publish --ignore-scripts

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [metadata, binaries, python-wheels, python-sdist, crates, pypi, npm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Drop the npm loader, which only ships inside the npm package
        run: rm -rf artifacts/fault-typescript-loader
      - name: Write SHA-256 checksums
        working-directory: artifacts
        run: |
          checksum_file=$(mktemp)
          while IFS= read -r -d '' file; do
            checksum=$(sha256sum "$file" | cut -d ' ' -f1)
            printf '%s  %s\n' "$checksum" "$(basename "$file")"
          done < <(find . -type f -print0 | sort -z) > "$checksum_file"
          mv "$checksum_file" SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
            artifacts/SHA256SUMS
          generate_release_notes: true
