name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked

  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo build --locked
          --package fault-model
          --package fault-engine
          --package fault-cli

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --workspace --all-targets --locked

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: >-
          uv sync --project fault-python --python 3.14
          --reinstall-package faultlib
      - run: >-
          uv run --project fault-python --python 3.14
          python -c "import faultlib; import faultlib._fault"
      - run: >-
          uv run --project fault-python --python 3.14
          ruff format --check fault-python/python examples
      - run: >-
          uv run --project fault-python --python 3.14
          ruff check fault-python/python examples

  typescript:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: fault-typescript
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fault-typescript/package-lock.json
      - name: Check the npm version matches the workspace
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "fault-typescript") | .version')
          package=$(node -p 'require("./package.json").version')
          if [[ "$crate" != "$package" ]]; then
            echo "package.json version $package does not match $crate" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run check:types
      - run: npm run build:debug
      - run: npm run check:examples
      - run: npm test
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - name: Test on Node.js 26
        run: npm test
      - uses: oven-sh/setup-bun@v2
      - run: npm run test:bun
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm run test:deno
