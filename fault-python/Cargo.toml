[package]
name = "fault-python"
description = "Python bindings for the fault network fault-injection engine"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
homepage.workspace = true
readme = "README.md"

[lib]
name = "_fault"
crate-type = ["cdylib"]

[dependencies]
fault-binding = { version = "1.2.1", path = "../fault-binding" }
pyo3 = { version = "0.29.0", features = ["abi3-py314", "extension-module"] }
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }
