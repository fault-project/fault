[package]
name = "fault-python"
description = "Python bindings for the fault network fault-injection engine"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
homepage.workspace = true
readme = "README.md"

[lib]
name = "_fault"
crate-type = ["cdylib"]

[dependencies]
fault-engine = { version = "1.0.0", path = "../fault-engine" }
fault-model = { version = "1.0.0", path = "../fault-model" }
pyo3 = { version = "0.29.0", features = ["abi3-py314", "extension-module"] }
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.49.0", features = ["sync"] }
uuid = "1.25.0"
